name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install libgomp (requis par LightGBM sur Linux)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-docker:
    needs: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t mlops1-api .

  deploy:
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy sur l'environnement cible simule (le runner lui-meme)
        run: ./deploy/deploy.sh
