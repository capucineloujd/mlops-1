name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlops
          POSTGRES_PASSWORD: mlops
          POSTGRES_DB: mlops
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mlops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install libgomp (requis par LightGBM sur Linux)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://mlops:mlops@localhost:5433/mlops
          TEST_DATABASE_URL: postgresql://mlops:mlops@localhost:5433/mlops
        run: uv run pytest tests/ -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-docker:
    needs: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t mlops1-api .

  deploy:
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy sur l'environnement cible simule (le runner lui-meme)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: ./deploy/deploy.sh
