services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops"]
      interval: 5s
      timeout: 5s
      retries: 5

  fluentd:
    build:
      context: .
      dockerfile: Dockerfile.fluentd
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "24224:24224"

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/Users/capucinejaud/mlops-1/mlruns

  api:
    build: .
    depends_on:
      mlflow-server:
        condition: service_started
      postgres:
        condition: service_healthy
      fluentd:
        condition: service_started
    ports:
      - "8000:8000"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: docker.api
        fluentd-async: "true"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_URI: models:/lightgbm-credit-scoring@gagnant
      DECISION_THRESHOLD: "0.499"
      DATABASE_URL: postgresql://mlops:mlops@postgres:5432/mlops
      # lue depuis un fichier .env local
      # jamais de valeur en dur ici
      API_KEY: "${API_KEY:?API_KEY manquante, copie .env.example vers .env et renseigne-la}"
    volumes:
      # les runs existants ont un artifact_uri en chemin disque local (pas
      # mlflow-artifacts://), donc le telechargement du modele se fait en
      # acces disque direct meme via un tracking server HTTP dedie
      - ./mlruns:/Users/capucinejaud/mlops-1/mlruns

volumes:
  postgres-data:
