<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# on parse champ "log" pour recuperer les champs structurés (event, reason...).
<filter docker.api>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# on sérialise l'enregistrement entier en JSON dans une colonne unique plutot
# que d'essayer de mapper chaque champ possible individuellement.
<filter docker.api>
  @type record_transformer
  enable_ruby true
  <record>
    raw_json ${record.to_json}
    event_name ${record["event"] || "unknown"}
    log_time_str ${Time.at(time).strftime('%Y-%m-%d %H:%M:%S')}
  </record>
</filter>

<match docker.api>
  @type sql
  host postgres
  port 5432
  database mlops
  adapter postgresql
  username mlops
  password mlops

  <table>
    table application_logs
    column_mapping "log_time_str:log_time,event_name:event,raw_json:raw_json"
  </table>

  <buffer>
    flush_interval 2s
  </buffer>
</match>
