[project]
name = "mlops-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "missingno>=0.5.2",
    "mlflow>=3.15.1",
    "numpy>=1.22,<=2.3",
    "optuna>=4.9.0",
    "pandas<3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "setuptools>=83.0.0",
    "shap>=0.51,<0.52",
    "xgboost>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "evidently>=0.7.21",
    "streamlit>=1.61.1",
    "psutil>=7.2.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.29.0",
    "skl2onnx>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
